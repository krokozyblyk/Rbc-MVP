<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Радио РБК — прямой эфир</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0d0f0e;
    color: #f2f4f3;
  }
  .card {
    width: min(420px, calc(100vw - 32px));
    padding: 32px 28px;
    border-radius: 20px;
    background: #161a18;
    border: 1px solid #232927;
    text-align: center;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: #009E59;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .08em;
  }
  h1 { margin: 16px 0 4px; font-size: 28px; }
  .sub { margin: 0 0 24px; color: #9aa5a1; font-size: 14px; }
  button {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 14px;
    background: #009E59;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .05s ease, background .15s ease;
  }
  button:active { transform: scale(.98); }
  button.on { background: #c1272d; }
  button:disabled { opacity: .6; cursor: default; }
  .status {
    margin-top: 16px;
    font-size: 14px;
    color: #9aa5a1;
    min-height: 20px;
  }
  .status.live { color: #2ed47a; }
  .status.warn { color: #f0b429; }
  .status.err { color: #ff6b6b; }
  .meta { margin-top: 20px; font-size: 12px; color: #5f6b67; line-height: 1.6; }
</style>
</head>
<body>
<main class="card">
  <span class="badge">ПРЯМОЙ ЭФИР</span>
  <h1>Радио РБК</h1>
  <p class="sub">Москва 92.8 FM · Санкт-Петербург 102.0 FM</p>

  <button id="toggle" type="button" aria-pressed="false">▶ Слушать</button>
  <div id="status" class="status">Остановлено</div>

  <audio id="player" preload="none"></audio>

  <div class="meta">
    Только трансляция: без музыки, новостей и плейлистов.<br>
    Прокси: HLS (AAC) → MP3, Content-Type: audio/mpeg.
  </div>
</main>

<script>
(function () {
  'use strict';

  // ''  — same-origin (локально: node server.js отдаёт и страницу, и /stream).
  // В проде (Vercel) впиши сюда адрес задеплоенного прокси:
  // например 'https://rbc-radio-proxy.onrender.com'
  var PROXY_ORIGIN = '';

  var audio = document.getElementById('player');
  var toggle = document.getElementById('toggle');
  var statusEl = document.getElementById('status');

  var MAX_RETRIES = 5;
  var RETRY_DELAY_MS = 2500;

  var params = new URLSearchParams(location.search);
  if (params.has('proxy')) {
    localStorage.setItem('rbcProxy', params.get('proxy'));
  }
  var proxy = params.get('proxy') || localStorage.getItem('rbcProxy') || PROXY_ORIGIN || '';
  proxy = proxy.replace(/\/+$/, '');

  var wantPlay = false;
  var retries = 0;
  var everPlayed = false;
  var retryTimer = null;

  function streamUrl() {
    return proxy + '/stream?bitrate=112&cb=' + Date.now();
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (cls ? ' ' + cls : '');
  }

  function setButton(on) {
    toggle.textContent = on ? '◼ Остановить' : '▶ Слушать';
    toggle.classList.toggle('on', on);
    toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function attach() {
    audio.src = streamUrl();
    audio.load();
    var p = audio.play();
    if (p && typeof p.catch === 'function') {
      p.catch(function (err) {
        if (err && err.name === 'NotAllowedError') {
          wantPlay = false;
          setButton(false);
          setStatus('Нажмите «Слушать» — браузер запретил автозапуск', 'warn');
        }
      });
    }
  }

  function scheduleRetry(message) {
    if (!wantPlay || retryTimer) return;
    if (retries >= MAX_RETRIES) {
      wantPlay = false;
      setButton(false);
      setStatus('Ошибка воспроизведения', 'err');
      return;
    }
    retries += 1;
    setStatus(message + ' (попытка ' + retries + '/' + MAX_RETRIES + ')', 'warn');
    retryTimer = setTimeout(function () {
      retryTimer = null;
      if (wantPlay) attach();
    }, RETRY_DELAY_MS);
  }

  function start() {
    wantPlay = true;
    retries = 0;
    clearTimeout(retryTimer);
    retryTimer = null;
    setButton(true);
    setStatus('Подключение…');
    attach();
  }

  function stop() {
    wantPlay = false;
    retries = 0;
    clearTimeout(retryTimer);
    retryTimer = null;
    audio.pause();
    audio.removeAttribute('src');
    audio.load();
    setButton(false);
    setStatus('Остановлено');
  }

  toggle.addEventListener('click', function () {
    if (wantPlay) stop(); else start();
  });

  audio.addEventListener('playing', function () {
    retries = 0;
    everPlayed = true;
    setStatus('В эфире', 'live');
  });

  audio.addEventListener('waiting', function () {
    if (wantPlay) setStatus('Буферизация…', 'warn');
  });

  audio.addEventListener('error', function () {
    if (!wantPlay) return;
    scheduleRetry('Сигнал потерян');
  });

  audio.addEventListener('stalled', function () {
    if (!wantPlay) return;
    if (audio.readyState >= 3) return; // HAVE_FUTURE_DATA — просто заминка на старте
    if (!everPlayed) return;           // прогрев ffmpeg — ждём, не ретраим
    scheduleRetry('Переподключение…');
  });

  window.addEventListener('offline', function () {
    if (wantPlay) scheduleRetry('Нет сети');
  });
})();
</script>
</body>
</html>
